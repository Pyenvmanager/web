                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}

                {d}

        );

        const Search = (props) => <IconBase {...props} d={<><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></>} />;
        const Workflow = (props) => <IconBase {...props} d={<><rect width="8" height="8" x="3" y="3" rx="2" /><path d="M7 11v4a2 2 0 0 0 2 2h4" /><rect width="8" height="8" x="13" y="13" rx="2" /></>} />;

                            <div className="mt-10 grid gap-5 md:grid-cols-3">
                                {constOutcomes.map((item) => (
                                    <Card key={item.title} className="rounded-3xl border-white/10 bg-white/5">
                                        <CardContent className="p-6">
                                            <div className="grid h-10 w-10 place-items-center rounded-2xl bg-white/10 mb-4">
                                                <item.icon className="h-5 w-5" />
                                            </div>
                                            <div className="text-base font-semibold">{item.title}</div>
                                            <p className="mt-2 text-sm leading-relaxed text-white/65">{item.body}</p>
                                        </CardContent>
                                    </Card>
                                ))}
                            </div>
                        </Container>
                    </Section>

                    {/* WHY NOW */}
                    <Section id="why-now" className="border-t border-white/10 bg-gradient-to-b from-black to-black/95">
                        <Container className="py-20 md:py-24">
                            <div className="grid gap-10 md:grid-cols-2">
                                <div>
                                    <Pill>
                                        <Workflow className="h-3.5 w-3.5" />
                                        Why now
                                    </Pill>
                                    <h2 className="mt-4 text-3xl font-semibold tracking-tight md:text-4xl">
                                        AI acceleration meets regulatory reality
                                    </h2>
                                    <p className="mt-4 text-white/70">
                                        Two forces have collided: machine-speed endpoint execution and rising expectations for proof.
                                        Developer endpoints are the only layer with no system of record.
                                    </p>

                                    <div className="mt-6 grid gap-3">
                                        {["Execution now precedes governance", "Visibility arrives late — or never", "Audit questions demand evidence"].map(
                                            (t) => (
                                                <div key={t} className="flex items-center gap-3 text-white/80">
                                                    <div className="grid h-7 w-7 place-items-center rounded-xl bg-white/10">
                                                        <Check className="h-4 w-4" />
                                                    </div>
                                                    <span className="text-sm">{t}</span>
                                                </div>
                                            )
                                        )}
                                    </div>
                                </div>

                                <Card className="rounded-3xl border-white/10 bg-white/5">
                                    <CardContent className="p-6 md:p-8">
                                        <div className="text-sm font-semibold">Built for</div>
                                        <div className="mt-6 grid gap-4">
                                            {[
                                                {
                                                    title: "Regulated enterprises",
                                                    body: "Healthcare, fintech, public sector — where audits and accountability are non-negotiable.",
                                                },
                                                {
                                                    title: "AI-heavy development",
                                                    body: "Teams using agents, fast iteration, and high environment churn on endpoints.",
                                                },
                                                {
                                                    title: "Security-forward organizations",
                                                    body: "AppSec and SecEng teams that need answers, not best-effort assumptions.",
                                                },
                                            ].map((x) => (
                                                <div key={x.title} className="rounded-2xl border border-white/10 bg-black/20 p-4">
                                                    <div className="text-sm font-semibold">{x.title}</div>
                                                    <p className="mt-1 text-sm text-white/65">{x.body}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </CardContent>
                                </Card>
                            </div>
                        </Container>
                    </Section>

                    {/* CONTACT */}
                    <Section id="contact" className="border-t border-white/10 bg-black">
                        <Container className="py-20 md:py-24">
                            <div className="grid gap-10 md:grid-cols-2 md:items-start">
                                <div>
                                    <Pill>
                                        <ArrowRight className="h-3.5 w-3.5" />
                                        Contact
                                    </Pill>
                                    <h2 className="mt-4 text-3xl font-semibold tracking-tight md:text-4xl">
                                        Work with us as a design partner
                                    </h2>
                                    <p className="mt-4 text-white/70">
                                        If execution has outpaced your visibility, we’d value the chance to explore whether Taurus Meridian fits your environment.
                                    </p>

                                    <div className="mt-6 grid gap-3">
                                        {["Fast pilot motion", "Air-gapped option", "Security-owned outcomes"].map((t) => (
                                            <div key={t} className="flex items-center gap-3 text-white/80">
                                                <div className="grid h-7 w-7 place-items-center rounded-xl bg-white/10">
                                                    <Check className="h-4 w-4" />
                                                </div>
                                                <span className="text-sm">{t}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <Card className="rounded-3xl border-white/10 bg-white/5">
                                    <CardContent className="p-6 md:p-8">
                                        {submitted ? (
                                            <div className="space-y-3">
                                                <div className="text-lg font-semibold">Thanks — we’ll reach out.</div>
                                                <p className="text-sm text-white/65">
                                                    Your message has been captured.
                                                </p>
                                                <Button
                                                    onClick={() => {
                                                        setSubmitted(false);
                                                        setForm({ name: "", email: "", company: "", message: "" });
                                                    }}
                                                >
                                                    Submit another
                                                </Button>
                                            </div>
                                        ) : (
                                            <form onSubmit={onSubmit} className="space-y-4">
                                                <div className="grid gap-4 md:grid-cols-2">
                                                    <div>
                                                        <label className="text-xs text-white/60">Name</label>
                                                        <input
                                                            className="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3 text-sm text-white placeholder:text-white/35 outline-none focus:ring-2 focus:ring-white/20"
                                                            placeholder="Your name"
                                                            value={form.name}
                                                            onChange={(e) => setForm({ ...form, name: e.target.value })}
                                                            required
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="text-xs text-white/60">Work email</label>
                                                        <input
                                                            type="email"
                                                            className="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3 text-sm text-white placeholder:text-white/35 outline-none focus:ring-2 focus:ring-white/20"
                                                            placeholder="name@company.com"
                                                            value={form.email}
                                                            onChange={(e) => setForm({ ...form, email: e.target.value })}
                                                            required
                                                        />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-xs text-white/60">Company</label>
                                                    <input
                                                        className="mt-1 w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3 text-sm text-white placeholder:text-white/35 outline-none focus:ring-2 focus:ring-white/20"
                                                        placeholder="Your company"
                                                        value={form.company}
                                                        onChange={(e) => setForm({ ...form, company: e.target.value })}
                                                    />
                                                </div>
                                                <div>
                                                    <label className="text-xs text-white/60">What are you trying to solve?</label>
                                                    <textarea
                                                        className="mt-1 min-h-[120px] w-full rounded-xl border border-white/10 bg-black/30 px-4 py-3 text-sm text-white placeholder:text-white/35 outline-none focus:ring-2 focus:ring-white/20"
                                                        placeholder="Share your environment, constraints, and what ‘proof’ looks like internally."
                                                        value={form.message}
                                                        onChange={(e) => setForm({ ...form, message: e.target.value })}
                                                    />
                                                </div>
                                                <Button className="w-full" type="submit">
                                                    Request Access
                                                    <ArrowRight className="ml-2 h-4 w-4" />
                                                </Button>
                                                <p className="text-xs text-white/45">
                                                    By submitting, you agree we may contact you about Taurus Meridian. No spam.
                                                </p>
                                            </form>
                                        )}
                                    </CardContent>
                                </Card>
                            </div>
                        </Container>
                    </Section>

                    {/* FOOTER */}
                    <footer className="border-t border-white/10 bg-black">
                        <Container className="py-10">
                            <div className="flex flex-col items-start justify-between gap-6 md:flex-row md:items-center">
                                <div className="flex items-center gap-2">
                                    <div className="grid h-9 w-9 place-items-center rounded-xl border border-white/15 bg-white/5">
                                        <Lock className="h-4 w-4 text-white/85" />
                                    </div>
                                    <div>
                                        <div className="text-sm font-semibold">Taurus Meridian</div>
                                        <div className="text-xs text-white/55">The system of record for AI-native execution</div>
                                    </div>
                                </div>

                                <div className="flex flex-wrap items-center gap-5 text-sm text-white/55">
                                    <a className="hover:text-white" href="#problem">Problem</a>
                                    <a className="hover:text-white" href="#solution">Solution</a>
                                    <a className="hover:text-white" href="#outcomes">Outcomes</a>
                                    <a className="hover:text-white" href="#why-now">Why now</a>
                                    <a className="hover:text-white" href="#contact">Contact</a>
                                </div>

                                <div className="text-xs text-white/45">© {new Date().getFullYear()} Taurus Meridian</div>
                            </div>
                        </Container>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<TaurusMeridianWebsite />);
    </script>
</body>
</html>
